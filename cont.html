<!doctype html>
<html>
  <head>
    <title>Contacts.</title>
    <link rel="stylesheet" href="cont.css" />
  </head>

  <body>
    <div class="container">
      <div class="text">
        <h1>CONTACT ME</h1>
        <p>If you have any questions.</p>
        <div class="ig">
          <div class="ig-btn">
            <img
              class="ig-img"
              src="images/ig.png"
              alt="This is an image of ig"
            />
          </div>

          <div class="ig-txt">
            <p><a href="https://www.instagram.com/">Instagram</a></p>
          </div>
        </div>

        <div class="facebook">
          <div class="face-btn">
            <img
              class="face-img"
              src="images/facebook_icon.png"
              alt="This is an image of face"
            />
          </div>

          <div class="face-txt">
            <p><a href="https://www.facebook.com/">Facebook</a></p>
          </div>
        </div>

        <div class="x">
          <div class="x-btn">
            <img class="x-img" src="images/x.jpg" alt="This is an image of X" />
          </div>

          <div class="x-txt">
            <p><a href="https://x.com/">X</a></p>
          </div>
        </div>

        <div class="whatsapp">
          <div class="wha-btn">
            <img
              class="wha-img"
              src="images/whatsapp.webp"
              alt="This is an image of whatsapp"
            />
          </div>

          <div class="wha-txt">
            <p><a href="https://web.whatsapp.com/">Whatsapp</a></p>
          </div>
        </div>
      </div>

      <div class="form">
        <form action="homepage.html">
          <label for="name">Name</label><br />
          <input
            type="text"
            required
            placeholder="James Bond"
            id="name"
          /><br /><br />

          <label for="email">Email</label><br />
          <input
            type="text"
            required
            placeholder="example@domain.com"
            id="email"
          /><br /><br />

          <label for="message">Message</label><br />
          <input
            type="text"
            required
            placeholder="Your Message"
            id="message"
          /><br /><br />

          <input type="submit" value="Submit" id="sub" />
        </form>
      </div>
    </div>
  </body>
</html>
